<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J.A.R.V.I.S</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --primary: #00d4ff;
    --secondary: #0066ff;
    --accent: #ff6600;
    --bg: #020a14;
    --surface: rgba(0, 212, 255, 0.04);
    --border: rgba(0, 212, 255, 0.2);
    --text: #c8eeff;
    --dim: rgba(200, 238, 255, 0.4);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: 'Rajdhani', sans-serif;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    overflow-x: hidden;
  }

  /* Background grid */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(0,212,255,0.04) 1px, transparent 1px),
      linear-gradient(90deg, rgba(0,212,255,0.04) 1px, transparent 1px);
    background-size: 40px 40px;
    pointer-events: none;
    z-index: 0;
  }

  /* Ambient glow */
  body::after {
    content: '';
    position: fixed;
    top: -30%;
    left: 50%;
    transform: translateX(-50%);
    width: 80vw;
    height: 60vh;
    background: radial-gradient(ellipse, rgba(0,102,255,0.12) 0%, transparent 70%);
    pointer-events: none;
    z-index: 0;
  }

  /* HEADER */
  header {
    position: relative;
    z-index: 10;
    padding: 18px 24px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    border-bottom: 1px solid var(--border);
    background: rgba(2,10,20,0.9);
    backdrop-filter: blur(10px);
  }

  .logo {
    font-family: 'Orbitron', monospace;
    font-size: 20px;
    font-weight: 900;
    letter-spacing: 6px;
    color: var(--primary);
    text-shadow: 0 0 20px rgba(0,212,255,0.6);
  }

  .logo span { color: var(--accent); }

  .status-bar {
    display: flex;
    align-items: center;
    gap: 16px;
    font-size: 11px;
    letter-spacing: 2px;
    color: var(--dim);
    font-family: 'Orbitron', monospace;
  }

  .status-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: #00ff88;
    box-shadow: 0 0 8px #00ff88;
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(0.8); }
  }

  /* MAIN */
  main {
    position: relative;
    z-index: 5;
    flex: 1;
    display: flex;
    flex-direction: column;
    max-width: 900px;
    width: 100%;
    margin: 0 auto;
    padding: 0 16px;
  }

  /* ARC REACTOR */
  .arc-reactor {
    display: flex;
    justify-content: center;
    padding: 28px 0 16px;
  }

  .reactor-container {
    position: relative;
    width: 90px; height: 90px;
    display: flex; align-items: center; justify-content: center;
  }

  .reactor-ring {
    position: absolute;
    border-radius: 50%;
    border: 2px solid var(--primary);
    animation: spin linear infinite;
  }

  .ring1 { width: 90px; height: 90px; animation-duration: 8s; border-style: dashed; opacity: 0.4; }
  .ring2 { width: 72px; height: 72px; animation-duration: 5s; animation-direction: reverse; opacity: 0.6; }
  .ring3 { width: 54px; height: 54px; animation-duration: 3s; border-color: var(--secondary); opacity: 0.8; }

  @keyframes spin {
    from { transform: rotate(0deg); }
    to { transform: rotate(360deg); }
  }

  .reactor-core {
    width: 36px; height: 36px;
    border-radius: 50%;
    background: radial-gradient(circle, #ffffff 0%, var(--primary) 40%, var(--secondary) 100%);
    box-shadow: 0 0 20px var(--primary), 0 0 40px rgba(0,212,255,0.4);
    z-index: 2;
    animation: glow 2s ease-in-out infinite;
  }

  @keyframes glow {
    0%, 100% { box-shadow: 0 0 20px var(--primary), 0 0 40px rgba(0,212,255,0.4); }
    50% { box-shadow: 0 0 30px var(--primary), 0 0 60px rgba(0,212,255,0.6), 0 0 80px rgba(0,102,255,0.3); }
  }

  /* GREETING */
  .greeting {
    text-align: center;
    margin-bottom: 20px;
  }

  .greeting h2 {
    font-family: 'Orbitron', monospace;
    font-size: 13px;
    letter-spacing: 4px;
    color: var(--dim);
    margin-bottom: 4px;
  }

  .greeting p {
    font-size: 15px;
    color: var(--text);
    letter-spacing: 1px;
  }

  /* CHAT */
  #chat-box {
    flex: 1;
    overflow-y: auto;
    padding: 12px 0;
    display: flex;
    flex-direction: column;
    gap: 12px;
    max-height: 42vh;
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }

  .message {
    display: flex;
    gap: 10px;
    animation: fadeIn 0.3s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .message.user { flex-direction: row-reverse; }

  .avatar {
    width: 32px; height: 32px;
    border-radius: 50%;
    border: 1px solid var(--border);
    display: flex; align-items: center; justify-content: center;
    font-size: 13px;
    flex-shrink: 0;
    font-family: 'Orbitron', monospace;
    font-weight: 700;
  }

  .message.user .avatar {
    background: rgba(255,102,0,0.15);
    border-color: rgba(255,102,0,0.4);
    color: var(--accent);
  }

  .message.jarvis .avatar {
    background: rgba(0,212,255,0.1);
    color: var(--primary);
  }

  .bubble {
    max-width: 78%;
    padding: 10px 14px;
    border-radius: 4px;
    font-size: 14px;
    line-height: 1.6;
    letter-spacing: 0.3px;
  }

  .message.jarvis .bubble {
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 3px solid var(--primary);
    color: var(--text);
  }

  .message.user .bubble {
    background: rgba(255,102,0,0.08);
    border: 1px solid rgba(255,102,0,0.25);
    border-right: 3px solid var(--accent);
    color: var(--text);
    text-align: right;
  }

  /* TASKS */
  #tasks-panel {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 12px 14px;
    margin-bottom: 12px;
    display: none;
  }

  #tasks-panel h3 {
    font-family: 'Orbitron', monospace;
    font-size: 10px;
    letter-spacing: 3px;
    color: var(--primary);
    margin-bottom: 10px;
  }

  #task-list { list-style: none; }

  #task-list li {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 0;
    border-bottom: 1px solid rgba(0,212,255,0.07);
    font-size: 13px;
    color: var(--text);
  }

  #task-list li:last-child { border-bottom: none; }

  #task-list li.done { text-decoration: line-through; color: var(--dim); }

  .task-check {
    width: 14px; height: 14px;
    border: 1px solid var(--primary);
    border-radius: 2px;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 10px;
    color: var(--primary);
    flex-shrink: 0;
  }

  /* CONTROLS */
  .controls {
    padding: 12px 0 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  #input-area {
    display: flex;
    align-items: center;
    gap: 8px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 4px;
    padding: 10px 14px;
    transition: border-color 0.2s;
  }

  #input-area:focus-within {
    border-color: rgba(0,212,255,0.5);
    box-shadow: 0 0 12px rgba(0,212,255,0.1);
  }

  #user-input {
    flex: 1;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-family: 'Rajdhani', sans-serif;
    font-size: 15px;
    letter-spacing: 0.5px;
  }

  #user-input::placeholder { color: var(--dim); font-size: 13px; }

  .btn {
    background: none;
    border: 1px solid var(--border);
    border-radius: 3px;
    color: var(--primary);
    cursor: pointer;
    padding: 6px 10px;
    font-family: 'Orbitron', monospace;
    font-size: 10px;
    letter-spacing: 1px;
    transition: all 0.2s;
    display: flex; align-items: center; gap: 5px;
  }

  .btn:hover {
    background: rgba(0,212,255,0.1);
    border-color: var(--primary);
    box-shadow: 0 0 8px rgba(0,212,255,0.2);
  }

  .btn.active {
    background: rgba(0,212,255,0.15);
    border-color: var(--primary);
    color: #fff;
  }

  .btn.send-btn {
    border-color: var(--primary);
    background: rgba(0,212,255,0.08);
    padding: 6px 16px;
  }

  #mic-btn.recording {
    border-color: #ff3333;
    color: #ff3333;
    background: rgba(255,51,51,0.1);
    animation: recordPulse 1s infinite;
  }

  @keyframes recordPulse {
    0%, 100% { box-shadow: 0 0 4px rgba(255,51,51,0.3); }
    50% { box-shadow: 0 0 12px rgba(255,51,51,0.6); }
  }

  .action-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
  }

  /* TYPING */
  .typing-indicator {
    display: flex; gap: 4px; padding: 4px 0;
  }

  .typing-indicator span {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--primary);
    animation: typingBounce 1.2s infinite;
  }

  .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
  .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }

  @keyframes typingBounce {
    0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
    30% { transform: translateY(-6px); opacity: 1; }
  }

  /* SCAN LINE */
  .scan-line {
    position: fixed;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--primary), transparent);
    animation: scan 4s ease-in-out infinite;
    z-index: 100;
    pointer-events: none;
    opacity: 0.5;
  }

  @keyframes scan {
    0% { top: 0; opacity: 0.5; }
    50% { top: 100%; opacity: 0.2; }
    100% { top: 0; opacity: 0.5; }
  }

  .corner {
    position: fixed;
    width: 20px; height: 20px;
    border-color: var(--primary);
    border-style: solid;
    opacity: 0.4;
    z-index: 50;
    pointer-events: none;
  }
  .corner.tl { top: 8px; left: 8px; border-width: 2px 0 0 2px; }
  .corner.tr { top: 8px; right: 8px; border-width: 2px 2px 0 0; }
  .corner.bl { bottom: 8px; left: 8px; border-width: 0 0 2px 2px; }
  .corner.br { bottom: 8px; right: 8px; border-width: 0 2px 2px 0; }
</style>
</head>
<body>

<div class="scan-line"></div>
<div class="corner tl"></div>
<div class="corner tr"></div>
<div class="corner bl"></div>
<div class="corner br"></div>

<header>
  <div class="logo">J.<span>A</span>.R.V.I.S</div>
  <div class="status-bar">
    <div class="status-dot"></div>
    <span>SİSTEM AKTİF</span>
  </div>
</header>

<main>
  <div class="arc-reactor">
    <div class="reactor-container">
      <div class="reactor-ring ring1"></div>
      <div class="reactor-ring ring2"></div>
      <div class="reactor-ring ring3"></div>
      <div class="reactor-core"></div>
    </div>
  </div>

  <div class="greeting">
    <h2>HOŞ GELDİNİZ, EFENDİM</h2>
    <p id="greeting-text">Bugün size nasıl yardımcı olabilirim?</p>
  </div>

  <div id="tasks-panel">
    <h3>// GÖREV LİSTESİ</h3>
    <ul id="task-list"></ul>
  </div>

  <div id="chat-box"></div>

  <div class="controls">
    <div id="input-area">
      <input id="user-input" type="text" placeholder="Komutunuzu girin, Efendim..." autocomplete="off" />
      <button class="btn send-btn" onclick="sendMessage()">GÖNDER</button>
    </div>
    <div class="action-row">
      <button class="btn" id="mic-btn" onclick="toggleMic()">🎤 SES</button>
      <button class="btn" onclick="addTask()">📋 GÖREV EKLE</button>
      <button class="btn" onclick="searchWeb()">🔍 WEB ARA</button>
      <button class="btn" onclick="clearChat()">🗑 TEMİZLE</button>
    </div>
  </div>
</main>

<script>
const API_URL = "https:///const API_URL = "https://api.groq.com/openai/v1/chat/completions";v1/messages";
const SYSTEM = `Sen J.A.R.V.I.S. — Just A Rather Very Intelligent System. 
Kullanıcıya daima "Efendim" diye hitap edersin. 
Resmi, profesyonel, zeki ve kibar bir ton kullanırsın. 
Cevapların kısa ve öz olmalı. 
Türkçe konuşursun. Iron Man'in yapay zekası gibi davranırsın.
Görev listesi yönetimi, web araması ve genel sorular için yardımcı olursun.
Görev eklemek istediğinde JSON formatında: {"action":"add_task","task":"..."}
Eğer web araması gerekiyorsa önce cevabı bilginden ver, gerekirse araştırdığını belirt.`;

let tasks = JSON.parse(localStorage.getItem('jarvis_tasks') || '[]');
let recognition = null;
let isRecording = false;
let conversationHistory = [];

// Init
window.onload = () => {
  updateGreeting();
  renderTasks();
  document.getElementById('user-input').addEventListener('keydown', e => {
    if (e.key === 'Enter') sendMessage();
  });
  if (tasks.length > 0) document.getElementById('tasks-panel').style.display = 'block';
};

function updateGreeting() {
  const h = new Date().getHours();
  const greetings = {
    morning: "Günaydın, Efendim. Sistemler tam kapasitede çalışıyor.",
    afternoon: "İyi öğleden sonralar, Efendim. Hizmetinizdeyim.",
    evening: "İyi akşamlar, Efendim. Emirlerinizi bekliyorum.",
    night: "İyi geceler, Efendim. Gece geç saatlerde de hizmetinizdeyim."
  };
  const txt = h < 12 ? greetings.morning : h < 17 ? greetings.afternoon : h < 21 ? greetings.evening : greetings.night;
  document.getElementById('greeting-text').textContent = txt;
}

function addMessage(role, text) {
  const box = document.getElementById('chat-box');
  const div = document.createElement('div');
  div.className = `message ${role}`;
  const initials = role === 'user' ? 'SİZ' : 'JAR';
  div.innerHTML = `
    <div class="avatar">${initials}</div>
    <div class="bubble">${text}</div>`;
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}

function showTyping() {
  const box = document.getElementById('chat-box');
  const div = document.createElement('div');
  div.className = 'message jarvis';
  div.id = 'typing-msg';
  div.innerHTML = `
    <div class="avatar">JAR</div>
    <div class="bubble">
      <div class="typing-indicator"><span></span><span></span><span></span></div>
    </div>`;
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}

function removeTyping() {
  const el = document.getElementById('typing-msg');
  if (el) el.remove();
}

async function sendMessage() {
  const input = document.getElementById('user-input');
  const text = input.value.trim();
  if (!text) return;
  input.value = '';

  addMessage('user', text);
  conversationHistory.push({ role: 'user', content: text });
  showTyping();

  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        system: SYSTEM,
        messages: conversationHistory
      })
    });

    const data = await res.json();
    removeTyping();

    const reply = data.content?.map(b => b.text || '').join('') || 'Bir hata oluştu, Efendim.';

    // Check for task action
    const taskMatch = reply.match(/\{"action":"add_task","task":"(.+?)"\}/);
    if (taskMatch) {
      const taskText = taskMatch[1];
      addTaskDirect(taskText);
      const cleanReply = reply.replace(/\{.*?\}/, '').trim() || `"${taskText}" görevi listenize eklendi, Efendim.`;
      addMessage('jarvis', cleanReply);
      conversationHistory.push({ role: 'assistant', content: cleanReply });
    } else {
      addMessage('jarvis', reply);
      conversationHistory.push({ role: 'assistant', content: reply });
    }
  } catch (err) {
    removeTyping();
    addMessage('jarvis', 'Sistemde bir aksaklık var, Efendim. Bağlantınızı kontrol edin.');
  }
}

function addTaskDirect(text) {
  tasks.push({ text, done: false, id: Date.now() });
  saveTasks();
  renderTasks();
}

function addTask() {
  const text = prompt('Görev girin, Efendim:');
  if (!text?.trim()) return;
  addTaskDirect(text.trim());
  addMessage('jarvis', `"${text.trim()}" görevi sisteme kaydedildi, Efendim.`);
}

function toggleTask(id) {
  const task = tasks.find(t => t.id === id);
  if (task) { task.done = !task.done; saveTasks(); renderTasks(); }
}

function saveTasks() {
  localStorage.setItem('jarvis_tasks', JSON.stringify(tasks));
}

function renderTasks() {
  const panel = document.getElementById('tasks-panel');
  const list = document.getElementById('task-list');
  list.innerHTML = '';
  if (tasks.length === 0) { panel.style.display = 'none'; return; }
  panel.style.display = 'block';
  tasks.forEach(t => {
    const li = document.createElement('li');
    if (t.done) li.classList.add('done');
    li.innerHTML = `<div class="task-check" onclick="toggleTask(${t.id})">${t.done ? '✓' : ''}</div>${t.text}`;
    list.appendChild(li);
  });
}

async function searchWeb() {
  const q = prompt('Ne aramak istersiniz, Efendim?');
  if (!q?.trim()) return;
  addMessage('user', `Web araması: ${q}`);
  conversationHistory.push({ role: 'user', content: `Web'de şunu ara ve bilgi ver: ${q}` });
  showTyping();

  try {
    const res = await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        system: SYSTEM,
        messages: conversationHistory,
        tools: [{ type: 'web_search_20250305', name: 'web_search' }]
      })
    });
    const data = await res.json();
    removeTyping();
    const reply = data.content?.map(b => b.text || '').filter(Boolean).join('') || 'Arama sonucu alınamadı, Efendim.';
    addMessage('jarvis', reply);
    conversationHistory.push({ role: 'assistant', content: reply });
  } catch {
    removeTyping();
    addMessage('jarvis', 'Arama sırasında hata oluştu, Efendim.');
  }
}

function toggleMic() {
  if (!('webkitSpeechRecognition' in window) && !('SpeechRecognition' in window)) {
    addMessage('jarvis', 'Ses tanıma özelliği bu tarayıcıda desteklenmiyor, Efendim. Chrome kullanmanızı öneririm.');
    return;
  }

  const btn = document.getElementById('mic-btn');

  if (isRecording) {
    recognition?.stop();
    isRecording = false;
    btn.classList.remove('recording');
    btn.textContent = '🎤 SES';
    return;
  }

  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  recognition = new SR();
  recognition.lang = 'tr-TR';
  recognition.continuous = false;
  recognition.interimResults = false;

  recognition.onresult = (e) => {
    const transcript = e.results[0][0].transcript;
    document.getElementById('user-input').value = transcript;
    sendMessage();
  };

  recognition.onend = () => {
    isRecording = false;
    btn.classList.remove('recording');
    btn.textContent = '🎤 SES';
  };

  recognition.onerror = () => {
    addMessage('jarvis', 'Ses algılanamadı, Efendim.');
    isRecording = false;
    btn.classList.remove('recording');
    btn.textContent = '🎤 SES';
  };

  recognition.start();
  isRecording = true;
  btn.classList.add('recording');
  btn.textContent = '⏹ DUR';
}

function clearChat() {
  document.getElementById('chat-box').innerHTML = '';
  conversationHistory = [];
  addMessage('jarvis', 'Sohbet geçmişi temizlendi, Efendim. Yeniden başlamaya hazırım.');
}
</script>
</body>
</html>
