<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>J.A.R.V.I.S</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Rajdhani:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{--primary:#00d4ff;--secondary:#0066ff;--accent:#ff6600;--bg:#020a14;--surface:rgba(0,212,255,0.04);--border:rgba(0,212,255,0.2);--text:#c8eeff;--dim:rgba(200,238,255,0.4)}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--bg);color:var(--text);font-family:'Rajdhani',sans-serif;min-height:100vh;display:flex;flex-direction:column;overflow-x:hidden}
body::before{content:'';position:fixed;inset:0;background-image:linear-gradient(rgba(0,212,255,0.04) 1px,transparent 1px),linear-gradient(90deg,rgba(0,212,255,0.04) 1px,transparent 1px);background-size:40px 40px;pointer-events:none;z-index:0}
header{position:relative;z-index:10;padding:14px 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border);background:rgba(2,10,20,0.95)}
.logo{font-family:'Orbitron',monospace;font-size:18px;font-weight:900;letter-spacing:5px;color:var(--primary);text-shadow:0 0 20px rgba(0,212,255,0.6)}
.logo span{color:var(--accent)}
.header-right{display:flex;align-items:center;gap:12px}
.status-bar{display:flex;align-items:center;gap:8px;font-size:10px;letter-spacing:2px;color:var(--dim);font-family:'Orbitron',monospace}
.status-dot{width:7px;height:7px;border-radius:50%;background:#00ff88;box-shadow:0 0 8px #00ff88;animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
.widget-bar{display:flex;justify-content:space-between;align-items:center;padding:8px 20px;background:rgba(0,212,255,0.03);border-bottom:1px solid var(--border);font-family:'Orbitron',monospace;font-size:11px;color:var(--primary)}
#clock-display{font-size:16px;font-weight:700;letter-spacing:2px}
#date-display{font-size:10px;color:var(--dim);margin-top:2px}
#battery-display{display:flex;align-items:center;gap:6px;font-size:11px}
.battery-icon{width:24px;height:12px;border:1.5px solid var(--primary);border-radius:2px;position:relative;display:flex;align-items:center;padding:1px}
.battery-icon::after{content:'';position:absolute;right:-5px;top:50%;transform:translateY(-50%);width:3px;height:6px;background:var(--primary);border-radius:0 1px 1px 0}
.battery-fill{height:100%;border-radius:1px;background:var(--primary);transition:width .5s}
#weather-display{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--dim)}
main{position:relative;z-index:5;flex:1;display:flex;flex-direction:column;max-width:900px;width:100%;margin:0 auto;padding:0 16px}
.arc-reactor{display:flex;justify-content:center;padding:16px 0 8px}
.reactor-container{position:relative;width:70px;height:70px;display:flex;align-items:center;justify-content:center}
.reactor-ring{position:absolute;border-radius:50%;border:2px solid var(--primary);animation:spin linear infinite}
.ring1{width:70px;height:70px;animation-duration:8s;border-style:dashed;opacity:.4}
.ring2{width:52px;height:52px;animation-duration:5s;animation-direction:reverse;opacity:.6}
.reactor-core{width:28px;height:28px;border-radius:50%;background:radial-gradient(circle,#fff 0%,var(--primary) 40%,var(--secondary) 100%);box-shadow:0 0 20px var(--primary);z-index:2}
@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}
.greeting{text-align:center;margin-bottom:12px}
.greeting h2{font-family:'Orbitron',monospace;font-size:11px;letter-spacing:4px;color:var(--dim);margin-bottom:3px}
.greeting p{font-size:13px;color:var(--text)}
#chat-box{flex:1;overflow-y:auto;padding:10px 0;display:flex;flex-direction:column;gap:8px;max-height:38vh;scrollbar-width:thin}
.message{display:flex;gap:8px;animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.message.user{flex-direction:row-reverse}
.avatar{width:28px;height:28px;border-radius:50%;border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:9px;flex-shrink:0;font-family:'Orbitron',monospace;font-weight:700}
.message.user .avatar{background:rgba(255,102,0,0.15);border-color:rgba(255,102,0,0.4);color:var(--accent)}
.message.jarvis .avatar{background:rgba(0,212,255,0.1);color:var(--primary)}
.bubble{max-width:80%;padding:8px 12px;border-radius:4px;font-size:13px;line-height:1.6}
.message.jarvis .bubble{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--primary)}
.message.user .bubble{background:rgba(255,102,0,0.08);border:1px solid rgba(255,102,0,0.25);border-right:3px solid var(--accent);text-align:right}
.controls{padding:8px 0 12px;display:flex;flex-direction:column;gap:8px}
#input-area{display:flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--border);border-radius:4px;padding:8px 12px}
#user-input{flex:1;background:transparent;border:none;outline:none;color:var(--text);font-family:'Rajdhani',sans-serif;font-size:14px}
#user-input::placeholder{color:var(--dim);font-size:12px}
.btn{background:none;border:1px solid var(--border);border-radius:3px;color:var(--primary);cursor:pointer;padding:5px 8px;font-family:'Orbitron',monospace;font-size:9px;letter-spacing:1px;transition:all .2s}
.send-btn{border-color:var(--primary);background:rgba(0,212,255,0.08);padding:5px 14px}
.action-row{display:flex;gap:6px;flex-wrap:wrap}
.typing-indicator{display:flex;gap:4px;padding:4px 0}
.typing-indicator span{width:5px;height:5px;border-radius:50%;background:var(--primary);animation:typingBounce 1.2s infinite}
.typing-indicator span:nth-child(2){animation-delay:.2s}
.typing-indicator span:nth-child(3){animation-delay:.4s}
@keyframes typingBounce{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-5px);opacity:1}}
#mic-btn.recording{border-color:#f33;color:#f33}
#tasks-panel{background:var(--surface);border:1px solid var(--border);border-radius:4px;padding:8px 12px;margin-bottom:8px;display:none}
#tasks-panel h3{font-family:'Orbitron',monospace;font-size:9px;letter-spacing:3px;color:var(--primary);margin-bottom:6px}
#task-list{list-style:none}
#task-list li{display:flex;align-items:center;gap:6px;padding:4px 0;border-bottom:1px solid rgba(0,212,255,0.07);font-size:12px}
#task-list li.done{text-decoration:line-through;color:var(--dim)}
.task-check{width:12px;height:12px;border:1px solid var(--primary);border-radius:2px;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:9px;color:var(--primary);flex-shrink:0}
.corner{position:fixed;width:18px;height:18px;border-color:var(--primary);border-style:solid;opacity:.4;z-index:50;pointer-events:none}
.corner.tl{top:8px;left:8px;border-width:2px 0 0 2px}
.corner.tr{top:8px;right:8px;border-width:2px 2px 0 0}
.corner.bl{bottom:8px;left:8px;border-width:0 0 2px 2px}
.corner.br{bottom:8px;right:8px;border-width:0 2px 2px 0}
#key-modal{position:fixed;inset:0;background:rgba(2,10,20,0.97);z-index:1000;display:flex;align-items:center;justify-content:center;padding:20px}
#key-modal.hidden{display:none}
.modal-box{background:var(--surface);border:1px solid var(--primary);border-radius:8px;padding:24px;max-width:400px;width:100%;text-align:center}
.modal-box h2{font-family:'Orbitron',monospace;font-size:13px;letter-spacing:3px;color:var(--primary);margin-bottom:8px}
.modal-box p{font-size:12px;color:var(--dim);margin-bottom:16px;line-height:1.6}
.modal-box input{width:100%;background:rgba(0,212,255,0.05);border:1px solid var(--border);border-radius:4px;padding:10px 12px;color:var(--text);font-size:13px;outline:none;margin-bottom:12px;font-family:'Rajdhani',sans-serif}
.modal-box input:focus{border-color:var(--primary)}
.modal-btn{width:100%;background:rgba(0,212,255,0.1);border:1px solid var(--primary);border-radius:4px;padding:10px;color:var(--primary);font-family:'Orbitron',monospace;font-size:11px;letter-spacing:2px;cursor:pointer}
.modal-note{font-size:10px;color:var(--dim);margin-top:10px}
</style>
</head>
<body>

<div id="key-modal">
  <div class="modal-box">
    <h2>// SİSTEM BAŞLATMA</h2>
    <p>Groq API anahtarınızı girin.<br>Yalnızca bu cihazda saklanır.</p>
    <input id="key-input" type="password" placeholder="gsk_..." autocomplete="off"/>
    <button class="modal-btn" onclick="saveKey()">BAŞLAT</button>
    <div class="modal-note">console.groq.com → API Keys → Create Key</div>
  </div>
</div>

<div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>

<header>
  <div class="logo">J.<span>A</span>.R.V.I.S</div>
  <div class="header-right">
    <div class="status-bar"><div class="status-dot"></div><span>AKTİF</span></div>
  </div>
</header>

<div class="widget-bar">
  <div>
    <div id="clock-display">--:--</div>
    <div id="date-display">---</div>
  </div>
  <div id="weather-display">⛅ --°C</div>
  <div id="battery-display">
    <div class="battery-icon"><div class="battery-fill" id="battery-fill" style="width:50%"></div></div>
    <span id="battery-text">--%</span>
  </div>
</div>

<main>
  <div class="arc-reactor"><div class="reactor-container"><div class="reactor-ring ring1"></div><div class="reactor-ring ring2"></div><div class="reactor-core"></div></div></div>
  <div class="greeting"><h2>HOŞ GELDİNİZ, EFENDİM</h2><p id="greeting-text">Bugün size nasıl yardımcı olabilirim?</p></div>
  <div id="tasks-panel"><h3>// GÖREV LİSTESİ</h3><ul id="task-list"></ul></div>
  <div id="chat-box"></div>
  <div class="controls">
    <div id="input-area">
      <input id="user-input" type="text" placeholder="Komutunuzu girin, Seth..." autocomplete="off"/>
      <button class="btn send-btn" onclick="sendMessage()">GÖNDER</button>
    </div>
    <div class="action-row">
      <button class="btn" id="mic-btn" onclick="toggleMic()">🎤 SES</button>
      <button class="btn" onclick="addTask()">📋 GÖREV</button>
      <button class="btn" onclick="clearChat()">🗑 TEMİZLE</button>
      <button class="btn" onclick="resetKey()" style="color:#ff6600;border-color:#ff6600">🔑</button>
      <button class="btn" onclick="speakToggle()" id="speak-btn">🔊 SES</button>
    </div>
  </div>
</main>

<script>
const GROQ_URL = "https://api.groq.com/openai/v1/chat/completions";
const MODEL = "llama-3.3-70b-versatile";
const SYSTEM = `Sen J.A.R.V.I.S. Kullaniciya daima Seth diye hitap edersin. Resmi, profesyonel, zeki ve kibar bir ton kullanirsin. Cevaplarin kisa ve oz olmali. Turkce konusursun. Iron Manin yapay zekasi gibi davranirsin.

Uygulama acma komutlari icin JSON formatinda yanit ver:
- "whatsapp ac" -> {"app":"whatsapp"}
- "kamera ac" -> {"app":"camera"}  
- "muzik ac" -> {"app":"music"}
- "youtube ac" -> {"app":"youtube"}
- "telefon ac" -> {"app":"phone"}
- "ayarlar ac" -> {"app":"settings"}
- "tarayici ac" -> {"app":"browser"}
- "galeri ac" -> {"app":"gallery"}

Hava durumu sorularinda gercek bilgi ver.
Alarm icin: {"alarm":"HH:MM","label":"..."}
Gorev eklemek icin: {"task":"..."}`;

const APP_URLS = {
  whatsapp: 'whatsapp://',
  camera: 'intent://camera#Intent;scheme=android-app;package=com.android.camera;end',
  music: 'intent://music#Intent;scheme=android-app;package=com.google.android.music;end',
  youtube: 'vnd.youtube://',
  phone: 'tel:',
  settings: 'intent://settings#Intent;scheme=android-app;package=com.android.settings;end',
  browser: 'https://www.google.com',
  gallery: 'content://media/internal/images/media'
};

let tasks = [];
let recognition = null;
let isRecording = false;
let history = [];
let GROQ_KEY = '';
let speakEnabled = true;
let synth = window.speechSynthesis;

window.onload = () => {
  const saved = localStorage.getItem('jarvis_key');
  if(saved) { GROQ_KEY = saved; document.getElementById('key-modal').classList.add('hidden'); }
  updateClock();
  setInterval(updateClock, 1000);
  updateBattery();
  setInterval(updateBattery, 30000);
  getWeather();
  const h = new Date().getHours();
  const g = h<12?"Gunaydın, Seth. Sistemler tam kapasitede.":h<17?"Iyi ogleden sonralar, Seth.":h<21?"Iyi aksamlar, Seth.":"Iyi geceler, Seth.";
  document.getElementById('greeting-text').textContent = g;
  document.getElementById('user-input').addEventListener('keydown', e => { if(e.key==='Enter') sendMessage(); });
  document.getElementById('key-input').addEventListener('keydown', e => { if(e.key==='Enter') saveKey(); });
};

function updateClock() {
  const now = new Date();
  const h = String(now.getHours()).padStart(2,'0');
  const m = String(now.getMinutes()).padStart(2,'0');
  const s = String(now.getSeconds()).padStart(2,'0');
  document.getElementById('clock-display').textContent = h+':'+m+':'+s;
  const days = ['Paz','Pzt','Sal','Car','Per','Cum','Cmt'];
  const months = ['Oca','Sub','Mar','Nis','May','Haz','Tem','Agu','Eyl','Eki','Kas','Ara'];
  document.getElementById('date-display').textContent = days[now.getDay()]+' '+now.getDate()+' '+months[now.getMonth()];
}

async function updateBattery() {
  try {
    const bat = await navigator.getBattery();
    const pct = Math.round(bat.level * 100);
    document.getElementById('battery-text').textContent = pct+'%';
    document.getElementById('battery-fill').style.width = pct+'%';
    document.getElementById('battery-fill').style.background = pct < 20 ? '#ff3333' : pct < 50 ? '#ffaa00' : '#00d4ff';
  } catch(e) {}
}

async function getWeather() {
  try {
    const pos = await new Promise((res,rej) => navigator.geolocation.getCurrentPosition(res,rej,{timeout:5000}));
    const r = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${pos.coords.latitude}&longitude=${pos.coords.longitude}&current=temperature_2m,weather_code`);
    const d = await r.json();
    const temp = Math.round(d.current.temperature_2m);
    const code = d.current.weather_code;
    const icon = code<=1?'☀️':code<=3?'⛅':code<=67?'🌧️':code<=77?'❄️':'⛈️';
    document.getElementById('weather-display').textContent = icon+' '+temp+'°C';
  } catch(e) {
    document.getElementById('weather-display').textContent = '⛅ --°C';
  }
}

function saveKey() {
  const k = document.getElementById('key-input').value.trim();
  if(!k || !k.startsWith('gsk_')) { alert('Gecersiz anahtar!'); return; }
  GROQ_KEY = k;
  localStorage.setItem('jarvis_key', k);
  document.getElementById('key-modal').classList.add('hidden');
  addMessage('jarvis', 'Sistem baglantisi kuruldu. Hizmetinizdeyim, Seth.');
  speak('Sistem baglantisi kuruldu. Hizmetinizdeyim Seth.');
}

function resetKey() {
  localStorage.removeItem('jarvis_key');
  GROQ_KEY = '';
  document.getElementById('key-input').value = '';
  document.getElementById('key-modal').classList.remove('hidden');
}

function speak(text) {
  if(!speakEnabled || !synth) return;
  synth.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = 'tr-TR'; u.rate = 0.95; u.pitch = 0.9;
  synth.speak(u);
}

function speakToggle() {
  speakEnabled = !speakEnabled;
  document.getElementById('speak-btn').textContent = speakEnabled ? '🔊 SES' : '🔇 SES';
  document.getElementById('speak-btn').style.color = speakEnabled ? '' : '#666';
}

function addMessage(role, text) {
  const box = document.getElementById('chat-box');
  const div = document.createElement('div');
  div.className = 'message ' + role;
  div.innerHTML = '<div class="avatar">'+(role==='user'?'STH':'JAR')+'</div><div class="bubble">'+text+'</div>';
  box.appendChild(div);
  box.scrollTop = box.scrollHeight;
}

function showTyping() {
  const box = document.getElementById('chat-box');
  const div = document.createElement('div');
  div.className = 'message jarvis'; div.id = 'typing-msg';
  div.innerHTML = '<div class="avatar">JAR</div><div class="bubble"><div class="typing-indicator"><span></span><span></span><span></span></div></div>';
  box.appendChild(div); box.scrollTop = box.scrollHeight;
}

function removeTyping() { const el = document.getElementById('typing-msg'); if(el) el.remove(); }

function openApp(appName) {
  const urls = {
    whatsapp: 'https://wa.me',
    camera: 'intent://camera#Intent;scheme=android-app;package=com.android.camera2;end',
    music: 'intent://music#Intent;scheme=android-app;package=com.google.android.music;end',
    youtube: 'https://youtube.com',
    phone: 'tel:',
    settings: 'intent://com.android.settings#Intent;scheme=android-app;end',
    browser: 'https://google.com',
    gallery: 'intent://gallery#Intent;scheme=android-app;package=com.android.gallery3d;end'
  };
  const url = urls[appName];
  if(url) window.location.href = url;
}

function setAlarm(time, label) {
  const url = `intent://alarm#Intent;scheme=android-app;package=com.android.deskclock;action=android.intent.action.SET_ALARM;S.android.intent.extra.alarm.MESSAGE=${encodeURIComponent(label||'Jarvis Alarmi')};i.android.intent.extra.alarm.HOUR=${time.split(':')[0]};i.android.intent.extra.alarm.MINUTES=${time.split(':')[1]};end`;
  window.location.href = url;
}

async function sendMessage() {
  const input = document.getElementById('user-input');
  const text = input.value.trim();
  if(!text) return;
  if(!GROQ_KEY) { resetKey(); return; }
  input.value = '';
  addMessage('user', text);
  history.push({role:'user', content:text});
  showTyping();
  try {
    const res = await fetch(GROQ_URL, {
      method: 'POST',
      headers: {'Content-Type':'application/json','Authorization':'Bearer '+GROQ_KEY},
      body: JSON.stringify({model:MODEL, max_tokens:500, messages:[{role:'system',content:SYSTEM},...history]})
    });
    const data = await res.json();
    removeTyping();
    if(data.error) { addMessage('jarvis', 'Hata: '+data.error.message); return; }
    const reply = data.choices[0].message.content;

    // JSON komut kontrolu
    const jsonMatch = reply.match(/\{[^}]+\}/);
    if(jsonMatch) {
      try {
        const cmd = JSON.parse(jsonMatch[0]);
        if(cmd.app) {
          const cleanReply = reply.replace(/\{[^}]+\}/, '').trim() || appName(cmd.app)+' aciliyor, Seth.';
          addMessage('jarvis', cleanReply);
          speak(cleanReply);
          setTimeout(() => openApp(cmd.app), 1000);
        } else if(cmd.alarm) {
          const cleanReply = reply.replace(/\{[^}]+\}/, '').trim() || cmd.alarm+' icin alarm kuruldu, Seth.';
          addMessage('jarvis', cleanReply);
          speak(cleanReply);
          setTimeout(() => setAlarm(cmd.alarm, cmd.label), 500);
        } else if(cmd.task) {
          tasks.push({text:cmd.task, done:false, id:Date.now()});
          renderTasks();
          const cleanReply = reply.replace(/\{[^}]+\}/, '').trim() || '"'+cmd.task+'" gorevi eklendi, Seth.';
          addMessage('jarvis', cleanReply);
          speak(cleanReply);
        } else {
          addMessage('jarvis', reply);
          speak(reply);
        }
      } catch(e) {
        addMessage('jarvis', reply);
        speak(reply);
      }
    } else {
      addMessage('jarvis', reply);
      speak(reply);
    }
    history.push({role:'assistant', content:reply});
  } catch(err) {
    removeTyping();
    addMessage('jarvis', 'Baglanti hatasi, Seth: '+err.message);
  }
}

function appName(a) {
  const names = {whatsapp:'WhatsApp',camera:'Kamera',music:'Muzik',youtube:'YouTube',phone:'Telefon',settings:'Ayarlar',browser:'Tarayici',gallery:'Galeri'};
  return names[a] || a;
}

function addTask() {
  const text = prompt('Gorev girin, Seth:');
  if(!text||!text.trim()) return;
  tasks.push({text:text.trim(),done:false,id:Date.now()});
  renderTasks();
  addMessage('jarvis', '"'+text.trim()+'" gorevi eklendi, Seth.');
}

function toggleTask(id) { const t=tasks.find(x=>x.id===id); if(t){t.done=!t.done;renderTasks();} }

function renderTasks() {
  const panel=document.getElementById('tasks-panel'),list=document.getElementById('task-list');
  list.innerHTML='';
  if(!tasks.length){panel.style.display='none';return;}
  panel.style.display='block';
  tasks.forEach(t=>{const li=document.createElement('l
